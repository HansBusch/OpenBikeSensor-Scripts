<head>
  <meta charset="utf-8"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.4.3/css/ol.css" type="text/css"/>
  <style>
    .map {
    position: absolute;
    width: 100%;
    height: 100%;
    left: 0px;
    top: 0px;
    z-index: 0;
    }
    .bw {
    filter: grayscale(100%) opacity(50%);
    }
	  .overlay{
	  display: flex;
	  flex-direction: column;
	  justify-content: space-around;
	  position: absolute;
	  width: 25%;
	  height: 98%;
	  left: 1%;
	  top: 1%;
	  z-index: 0;
	  }
	  .title {
	  display: flex;
	  position: relative;
	  height:20%;
	  width: 100%;
	  background-color: #FFFFFF;
	  padding: 5px;
	  z-index: 0;
	  }
	  .title_image {
	  height: 100%
	  }
	  .title_text {
	  padding: 0px;
	  height: 100%;
	  vertical-align: middle;
 	  background-color: #FF8080;
	  }
	  .caption {
	  	display: flex;
	  height: 25%;
	  width: 100%;
	  background-color: #FFFFFF;
	  padding: 5px;
 	  align-items: center;
	  z-index: 0;
	  }
	  .legend {
	  height: 25%;
	  width: 100%;
	  background-color: #FFFFFF;
	  padding: 5px;
	  z-index: 0;
	  }
    .ol-zoom {
    left: unset;
    right: 8px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.4.3/build/ol.js"></script>
  <script src="OBS.js"></script>

  <title>Unfallstatistik</title>
</head>
<body>
  <div id="map" class="map"></div>
  <div id="overlay" class="overlay">
	  <div id="title" class="title">
	    <!--<div id="title_image"><img src="images/OBS.png" height="100%"/></div>-->
	    <div id="title_text">
	      <h4>Unfallstatistik</h4>
		  		<table>
		<thead><th></th><th>Fu&szlig;</th><th>Rad</th><th>PKW</th><th>LKW</th><th>Krad</th><th>Sonstig</th></thead>
		<tbody id='stats'></tbody>
		</table>

		  <p>Datenbasis <a href='https://www.opengeodata.nrw.de/produkte/transport_verkehr/unfallatlas/'>Unfallatlas OpenGeodata.NRW</a></p>
		  <p>Visualisierung abgeleitet von <a href='https://github.com/openbikesensor/OpenBikeSensor-Scripts'>Open Bike Sensor Script</a>
	    </div>
	  </div>
    <div class="legend">
		<h4>Filter</h4>
		Beteiligte:<div style='margin-left:15px'>
		<label onclick="updateFilter()"><input type="checkbox" id="filterRad" name="Rad" />Rad</label>
		<label onclick="updateFilter()"><input type="checkbox" id="filterFuss"/>Fu&szlig;</label>
		<label onclick="updateFilter()"><input type="checkbox" id="filterPkw"/>PKW</label>
		<label onclick="updateFilter()"><input type="checkbox" id="filterLkw"/>LKW</label>
		<label onclick="updateFilter()"><input type="checkbox" id="filterKrad"/>Krad</label><br/>
		<label onclick="updateFilter()"><input type="checkbox" id="filter2Rad" name="Rad" />Rad</label>
		<label onclick="updateFilter()"><input type="checkbox" id="filter2Fuss"/>Fu&szlig;</label>
		<label onclick="updateFilter()"><input type="checkbox" id="filter2Pkw"/>PKW</label>
		<label onclick="updateFilter()"><input type="checkbox" id="filter2Lkw"/>LKW</label>
		<label onclick="updateFilter()"><input type="checkbox" id="filter2Krad"/>Krad</label><br/>
		</div><br/>
		Ort:	
		<div>
		<label onclick="updateFilter()"><input type="checkbox" id="filterAusserorts"/>Innerorts</label>
		</div><br/>
		Zeitraum:
		<div>
		  <input type="range" min="2015" max="2025" value="2015" id="jahrFilter" style='width:80%'><span id='jahrFeld' width='50px'>Alle</span>
		</div>
		</div>
    <div id="caption" class="caption">
    	<b>Bitte einen Messpunkt in der Karte (farbige Kreise) anklicken um detailierte Informationen zu erhalten.</b>
    </div>
  </div>

  <script type="text/javascript">
    var yearFilter = 'Alle';
	var displayFilter = [];
    function annotation(feature){
    var s = "<table>";

	const kats = ["", "Todesfolge", "Schwerverletzt", "Leichtverletzt"]
	cat = kats[Number(feature.get('KAT'))]
	const arts = ["", "Zusammensto\u00DF mit anfahrendem/anhaltendem/ruhendem Fahrzeug", "Zusammensto\u00DF mit vorausfahrendem / wartendem Fahrzeug", "Zusammensto\u00DF mit seitlich in gleicher Richtung fahrendem Fahrzeug", "Zusammensto\u00DF mit entgegenkommendem Fahrzeug",
		"Zusammensto\u00DF mit einbiegendem / kreuzendem Fahrzeug", "Zusammensto\u00DF zwischen Fahrzeug und Fu\u00DFg\u00e4nger", "Aufprall auf Fahrbahnhindernis", "Abkommen von Fahrbahn nach rechts", "Abkommen von Fahrbahn nach links", "Unfall anderer Art"]
	art = arts[Number(feature.get('ART'))]
	const typs = ["", "Fahrunfall", "Abbiegeunfall", "Einbiegen / Kreuzen-Unfall", "Überschreiten-Unfall", "Unfall durch ruhenden Verkehr", "Unfall im L\u00e4ngsverkehr", "sonstiger Unfall"]
	typ = typs[Number(feature.get('TYP'))]
	parties = "";
	for (let c of feature.get('IST'))	 {
		if (c == 'R') { parties += "Rad ";}
		else if (c == 'P') { parties += "PKW ";}
		else if (c == 'F') { parties += "Fu\u00DFg\u00e4nger ";}
		else if (c == 'K') { parties += "Kraftrad ";}
		else if (c == 'L') { parties += "LKW ";}
	}
//			} else if (kv[0] == "ART") {
//			} else if (kv[0] == "TYP") {
//			} else if (kv[0] == "IST") }
	
    s += "<td><div title='category'>Kategorie:</div></td><td><b>" + cat + "</b></td></tr>";
    s += "<td><div title='reason'>Unfallart:</div></td><td><b>" + art + "</b></td></tr>";
    s += "<td><div title='type'>Unfalltyp:</div></td><td><b>" + typ + "</b></td></tr>";
    s += "<td><div title='type'>Beteiligte:</div></td><td><b>" + parties + "</b></td></tr>";
	
    s += "<tr><td>Zeit/Datum der Messung:</td><td>" + feature.get('time') + "</td></tr>";

//    if (feature.get('has_OSM_annotations') == true){
//    s += "<tr><td>Position der Messung (korrigiert):</td><td>" + feature.get('latitude_projected').toFixed(6) + " " + feature.get('longitude_projected').toFixed(6) + "</td></tr>";
//    }
    s += "<tr><td>Position der Messung (GPS):</td><td>" + feature.get('latitude_GPS') + " " + feature.get('longitude_GPS') + "</td></tr>";

    if (feature.get('has_OSM_annotations')){
    s += "</tr><tr><td>- </td></tr><tr><td colspan=2><b>Information aus OpenStreetMap</b></td></tr>";
    s += "<tr><td>Weg-Kategorie:</td><td>" + feature.get('OSM_highway') + "</td></tr>";
//    s += "<tr><td>Anzahl Fahrstreifen:</td><td>" + feature.get('OSM_lanes') + "</td></tr>";
    s += "<tr><td>Geschwindigkeitsbegrenzung:</td><td>" + feature.get('OSM_maxspeed') + " km/h</td></tr>";
    s += "<tr><td>Stra&szlig;enname:</td><td>" + feature.get('OSM_name') + "</td></tr>";
//    s += "<tr><td>inner-/au&szlig;orts:</td><td>" + feature.get('OSM_zone') + "</td></tr>";
//    s += "<tr><td>OSM Weg-ID:</td><td><a href=\"https://www.openstreetmap.org/way/" + feature.get('OSM_way_id') + "\" target=\"_blank\">" + feature.get('OSM_way_id') + "</a></td></tr>";
//    s += "<tr><td>Comment:</td><td>" + feature.get('comment') + "</td></tr>";
    } else {
    s += "<tr><td colspan=2>keine OpenStreemMap Informationen vorhanden</td></tr>";
    }

    s += "</table>"
    return s;
    }


    function annotation_verbose(feature){
    var s = "";

    d = feature.get('distance_overtaker');
    s += "overtaker's distances: " + ((d == null)?"n/a":d.toFixed(2)) + " m\n";
    s += "time: " + feature.get('time') + "\n";

    s += "user id: " + feature.get('user_id') + "\n";
    s += "measurement id: " + feature.get('measurement_id') + "\n";

    if (feature.get('has_OSM_annotations') == true){
    s += "coordinates (projected): " + feature.get('latitude_projected').toFixed(6) + " " + feature.get('longitude_projected').toFixed(6) + "\n";
    }
    s += "coordinates (GPS): " + feature.get('latitude_GPS').toFixed(6) + " " + feature.get('longitude_GPS').toFixed(6) + "\n";

    d = feature.get('distance_overtaker');
    s += "distances: " + ((d == null)?"n/a":d.toFixed(2)) + " m | ";

    d = feature.get('distance_stationary');
    s += ((d == null)?"n/a":d.toFixed(2)) + " m\n";

    if (feature.get("egomotion_is_derived") == true){
    s += "movement (derived): ";
    } else {
    s += "movement (GPS): ";
    }
    c = feature.get('course');
    s += ((c == null)?"n/a":c.toFixed(0)) + " deg, ";

    v = feature.get('speed');
    s += ((v == null)?"n/a":(v * 3.6).toFixed(1)) + " km/h\n";

    if (feature.get('has_OSM_annotations')){
    s += "OSM annotations:\n";
    s += "highway: " + feature.get('OSM_highway') + "\n";
    s += "lanes: " + feature.get('OSM_lanes') + "\n";
    s += "maxspeed: " + feature.get('OSM_maxspeed') + " km/h\n";
    s += "name: " + feature.get('OSM_name') + "\n";
    s += "zone: " + feature.get('OSM_zone') + "\n";
    s += "oneway: " + feature.get('OSM_oneway') + "\n";
    s += "way_id: " + feature.get('OSM_way_id') + "\n";
    s += "way_orientation: " + feature.get('OSM_way_orientation') + "\n";
    } else {
    s += "(no OSM annotations assigned)\n";
    }
    return s;
    }

    //    https://tiles.wmflabs.org/bw-mapnik/${z}/${x}/${y}.png
    var map = new ol.Map({
    target: 'map',
    layers: [
    new ol.layer.Tile({
    className: "bw",
    source: new ol.source.OSM({
    // url: 'https://{a-c}.tile-cyclosm.openstreetmap.fr/cyclosm-lite/{z}/{x}/{y}.png',
    crossOrigin: null,
    url: 'https://{a-c}.tile.openstreetmap.org/{z}/{x}/{y}.png'
    })
    })
    ],
    view: new ol.View({
    center: ol.proj.fromLonLat([9.1798000, 48.7759000]),
    zoom: 16
    })
    });

    var textFill = new ol.style.Fill({
    color: '#fff'
    });
    var textStroke = new ol.style.Stroke({
    color: 'rgba(0, 0, 0, 255)',
    width: 3
    });

    var strokeDefault = new ol.style.Stroke({
    color: 'rgba(128, 128, 128, 255)',
    width: 1
    });

    var strokeDeselected = new ol.style.Stroke({
    color: 'rgba(0, 0, 0, 128)',
    width: 0.5
    });

    var strokeRural = new ol.style.Stroke({
    color: 'rgba(255, 255, 0, 255)',
    width: 1
    });


    var dataSource = new ol.source.Vector({
    format: new ol.format.GeoJSON(),
    url: 'json/measurements.json'
    });

    var vectorLayer = new ol.layer.Vector({
    source: dataSource,
    style: function(feature, resolution){ return styleFunction(feature, resolution, 0);}
    })

	//
	// init styles
	//
	var styles = [];
    styles[0] = new ol.style.Style({
		image: new ol.style.Circle({
		radius: 3,
		stroke: strokeDeselected}) });
    styles[1] = new ol.style.Style({
		image: new ol.style.Circle({
		radius: 4,
		fill: new ol.style.Fill({color: [170, 0, 0, 255]}),
		stroke: strokeDefault}) });
    styles[2] = new ol.style.Style({
		image: new ol.style.Circle({
		radius: 4,
		fill: new ol.style.Fill({color: [240, 0, 0, 255]}),
		stroke: strokeDefault}) });
    styles[3] = new ol.style.Style({
		image: new ol.style.Circle({
		radius: 4	,
		fill: new ol.style.Fill({color: [253, 218, 13, 255]}),
		stroke: strokeDefault}) });


    function styleFunction(feature, resolution, active) {
	
    var d = Number(feature.get('KAT'))
	var vis = true;
	var ist = feature.get("IST");
	if (show.length > 0) {
		var match = false;
		var match2 = show2.length == 0
		for (let c of show) {
			if (ist.includes(c)) match = true;
		}
		for (let c of show2) {
			if (ist.includes(c)) match2 = true;
		}
		if (!(match && match2)) { 
			vis = false
		}
		if (show == show2 && ist.length > 1) {
			vis = false
		}
	}
	var streetname = feature.get('OSM_name');
	if (intown && streetname == null) vis = false;
	
	if (yearFilter != 'Alle') {
		if (!feature.get('time').includes(yearFilter)) {
			vis = false
		}
	}
	if (vis) {
		if (show.length == 0) {
			//  assume that  injuries effect foot or bike and not PKW or LKW
			if (ist.includes('F') && ist.includes('R')) { ist = 'RF';}
			else if (ist.includes('F')) { ist = 'F';}
			else if (ist.includes('R')) { ist = 'R';}
		}
		for (let c of ist) {
			stats[c+d]++
		}
	} else {
		d = 0;
	}
    return styles[d];
    }

    map.addLayer(vectorLayer);

    const changeListener = dataSource.once('change', function(event) {
    		if (dataSource.getState() == 'ready') {
				dataSource.forEachFeature(feature => {
					var com = feature.get("comment").split(" ");
					for (let i of com) {
						let kv = i.split(':')
						if (kv.length == 2) {
							feature.set(kv[0], kv[1]);
						}
					}
				});

				const extent = vectorLayer.getSource().getExtent();
				const mapSize = map.getSize();
				const overlay = document.getElementById("overlay");
				const marginLeft = overlay.offsetWidth + overlay.offsetLeft;
    			map.getView().fit(extent, {size: mapSize, padding: [0, 0, 0, marginLeft]});
				updateFilter();
			}
		});

	var show = "", show2 = ""
	var intown = false;
	function updateFilter() {
		show = "";
		show2 = "";
		if (document.getElementById("filterRad").checked) show += 'R';
		if (document.getElementById("filterFuss").checked) show += 'F';
		if (document.getElementById("filterPkw").checked) show += 'P';
		if (document.getElementById("filterLkw").checked) show += 'L';
		if (document.getElementById("filterKrad").checked) show += 'K';
		if (document.getElementById("filter2Rad").checked) show2 += 'R';
		if (document.getElementById("filter2Fuss").checked) show2 += 'F';
		if (document.getElementById("filter2Pkw").checked) show2 += 'P';
		if (document.getElementById("filter2Lkw").checked) show2 += 'L';
		if (document.getElementById("filter2Krad").checked) show2 += 'K';
		intown = document.getElementById("filterAusserorts").checked;
		selectNode(null);
	}
	var stats = {};
	function selectNode(feature) {
		stats['P1'] = stats['P2'] = stats['P3'] = 0
		stats['R1'] = stats['R2'] = stats['R3'] = 0
		stats['F1'] = stats['F2'] = stats['F3'] = 0
		stats['L1'] = stats['L2'] = stats['L3'] = 0
		stats['K1'] = stats['K2'] = stats['K3'] = 0
		stats['S1'] = stats['S2'] = stats['S3'] = 0
		if (feature != null) {
			var prop = feature.getProperties();
			if (prop.hasOwnProperty('parent')) feature = prop.parent;
			if (dataSource.hasFeature(feature)) {
			var coord = feature.getGeometry().getCoordinates();
			var props = feature.getProperties();
			caption.innerHTML = annotation(feature);
			caption.style.alignItems="flex-start";
			console.log(annotation_verbose(feature));
			feature.setStyle(styleFunction(feature, undefined, 1));
			}
		}
		vectorLayer.getSource().getFeatures().forEach(f=>{
		if (f != feature) {
		var sel = 0;
		if (displayFilter.length > 0) {
			var val = f.get(displayFilter[0].key);
			if (displayFilter[0].op == "==") {
				if (displayFilter[0].val != val) sel = -1; 
			}
			else {
				var fval = val ? parseFloat(val) : 2;		// map missing to 2m distance
				var fcomp  = parseFloat(displayFilter[0].val);
				if (displayFilter[0].op == "<") { if (fval >= fcomp) sel = -1;}
				else if (displayFilter[0].op == ">") { if (fval <= fcomp) sel = -1;}
			}
		}
		f.setStyle(styleFunction(f, undefined, sel));
		}
		});
		fillStats();
	}

    map.on('singleclick', function(evt) {
	var sources = vectorLayer.getSource();
		var feature = vectorLayer.getSource().getClosestFeatureToCoordinate(evt.coordinate);
		if (feature) {
			var closest = feature.getGeometry().getClosestPoint(evt.coordinate);
			var lonlat = ol.proj.transform(evt.coordinate, 'EPSG:3857', 'EPSG:4326');
			var lonlat2 = ol.proj.transform(closest, 'EPSG:3857', 'EPSG:4326');
			distance = ol.sphere.getDistance([lonlat[0], lonlat[1]], [lonlat2[0], lonlat2[1]]);
			if (distance < 100) selectNode(feature);
			else selectNode(null)
		}
		return feature;
    });

	var input = document.getElementById("filterRad");
	input.addEventListener("keypress", function(event) {
		if (event.key === "Enter") {
		event.preventDefault();
		displayFilter = []
		var args = input.value.replace(/\s+/g, ' ').trim().split(' ');
		if (args.length >= 3) {
			var f = {key:args[0], op:args[1], val:args[2]}
			displayFilter.push(f);
		}
		updateFilter();
  }
}); 
  var slider = document.getElementById("jahrFilter");
  var output = document.getElementById("jahrFeld");
  slider.oninput = function() {
    var val = this.value;
	if (val == '2015') { val = 'Alle';}
	yearFilter = val;
    output.innerHTML = val;
	selectNode(null);
  } 
  
  function fillStats() {
	var body = document.getElementById("stats");
	body.innerHTML = '<tr><th>t&ouml;dlich</th><td>'+stats['F1']+'</td><td>'+stats['R1']+'</td><td>'+stats['P1']+'</td><td>'+stats['L1']+'</td><td>'+stats['K1']+'</td><td>'+stats['S1']+'</td></tr>'+
		'<tr><th>schwer</th><td>'+stats['F2']+'</td><td>'+stats['R2']+'</td><td>'+stats['P2']+'</td><td>'+stats['L2']+'</td><td>'+stats['K2']+'</td><td>'+stats['S2']+'</td></tr>'+
		'<tr><th>leicht</th><td>'+stats['F3']+'</td><td>'+stats['R3']+'</td><td>'+stats['P3']+'</td><td>'+stats['L3']+'</td><td>'+stats['K3']+'</td><td>'+stats['S3']+'</td></tr>';
  }

  </script>
</body>
</html>
